name: Check Anna metadata availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Inspect only official torrent metadata and cache availability
        env:
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
        run: node tools/anna-availability.mjs
